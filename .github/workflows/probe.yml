name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for m in litematica malilib; do
            echo "== $m"
            curl -s -A "reden-port-probe" "https://api.modrinth.com/v2/project/$m/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D" | python3 -c "import json,sys; [print(v['id'],v['version_number'],v['date_published'][:10]) for v in json.load(sys.stdin)[:5]]"
          done
