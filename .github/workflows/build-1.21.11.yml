name: Build 1.21.11
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew ":1.21.11:build" --stacktrace
      - name: Inspect Minecraft API
        if: always()
        run: |
          M=~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft
          CP=$(ls $M/minecraft-clientonly/*/*.jar $M/minecraft-common/*/*.jar | tr '\n' ':')
          M=~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft
          CP=$(ls $M/minecraft-clientonly/*/*.jar $M/minecraft-common/*/*.jar | tr '\n' ':')
          javap -p -cp "$CP" net.minecraft.client.Minecraft | grep -i "service\|getUser\|user()"
          javap -p -cp "$CP" net.minecraft.client.Minecraft | grep -i "Services"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reden-1.21.11
          path: versions/1.21.11/build/libs/*.jar
