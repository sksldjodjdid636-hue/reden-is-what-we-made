name: Build 1.21.11
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew ":1.21.11:build" --stacktrace
      - name: Inspect Minecraft API
        if: always()
        run: |
          M=~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft
          CP=$(ls $M/minecraft-clientonly/*/*.jar $M/minecraft-common/*/*.jar | tr '\n' ':')
          for c in net.minecraft.client.gui.components.ChatComponent net.minecraft.client.gui.screens.ChatScreen 'net.minecraft.client.GuiMessage$Line' net.minecraft.client.gui.screens.Screen; do
            echo "=== $c"; javap -p -cp "$CP" "$c" 2>&1 | head -90
          done
          echo "=== GuiGraphics"; javap -p -cp "$CP" net.minecraft.client.gui.GuiGraphics 2>&1 | grep -i "blit\|pose\|fillGradient\|drawCenteredString\|centeredText\|Matrix"
          echo "=== Input classes"; javap -p -cp "$CP" net.minecraft.client.input.KeyEvent net.minecraft.client.input.MouseButtonEvent 2>&1 | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reden-1.21.11
          path: versions/1.21.11/build/libs/*.jar
